name: Daily Gas Box AI Inspection

on:
  schedule:
    # 12:00 UTC = 3:00 PM Baghdad Time (Admin Preview)
    - cron: '0 12 * * *'
    # 13:00 UTC = 4:00 PM Baghdad Time (Final Dispatch)
    - cron: '0 13 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Select Run Mode'
        required: true
        default: 'final'
        type: choice
        options:
          - 'preview'
          - 'final'

jobs:
  run-inspection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Playwright
        run: |
          pip install requests pytz pillow ultralytics torch torchvision opencv-python-headless playwright
          playwright install chromium
          playwright install-deps chromium

      # RUN ADMIN PREVIEW (3:00 PM Schedule OR Manual 'preview' Selection)
      - name: Run Admin Preview Mode
        if: github.event.schedule == '0 12 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'preview')
        env:
          ZENPUT_API_KEY: ${{ secrets.ZENPUT_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PREVIEW_MODE: 'true'
        run: python main.py

      # RUN FINAL DISPATCH (4:00 PM Schedule OR Manual 'final' Selection)
      - name: Run Final Dispatch Mode
        if: github.event.schedule == '0 13 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'final')
        env:
          ZENPUT_API_KEY: ${{ secrets.ZENPUT_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PREVIEW_MODE: 'false'
        run: python main.py

      - name: Upload Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GasBox_Report_Today
          path: |
            *.html
            *.pdf
